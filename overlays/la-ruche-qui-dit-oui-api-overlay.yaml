- target: $.paths['/orders/'].get
  description: Classify the order listing and note the missing pagination contract.
  update:
    x-agentic-access:
      action_class: read
      consequence: none
      scope: member_orders
      escalation: none
    x-pagination:
      supported: false
      detail: >-
        Returns a count plus the full orders array with no limit, offset or
        cursor parameter. Unbounded response growth is a real risk for
        long-tenured members.
- target: $.paths['/distributions/{id}/basket/confirm/'].post
  description: Flag basket confirmation as an unguarded money-movement operation.
  update:
    x-agentic-access:
      action_class: write
      consequence: money_movement
      scope: member_orders
      escalation: human_confirmation_required
    x-idempotency:
      supported: false
      risk: high
      detail: >-
        No idempotency key is accepted. A retried or replayed confirmation has
        no documented protection against generating a duplicate payment
        hand-off. Do not retry automatically.
- target: $.paths['/orders/{id}/payments/'].post
  description: Flag order repayment as an unguarded money-movement operation.
  update:
    x-agentic-access:
      action_class: write
      consequence: money_movement
      scope: member_orders
      escalation: human_confirmation_required
    x-idempotency:
      supported: false
      risk: high
      detail: >-
        No idempotency key is accepted on a retry-shaped operation. Repayment is
        by definition invoked after a failure, which is exactly when blind
        retries cause double charges.
- target: $.components.securitySchemes.oauth2
  description: Record the security posture of the documented grant.
  update:
    x-security-posture:
      rfc9700_compliant: false
      detail: >-
        Resource-owner password credentials grant only. RFC 9700 recommends
        against it and OAuth 2.1 removes it. No PKCE, no authorization code
        flow, no scopes.
- target: $.components.schemas.OrderState
  description: Note the redundant status/state pair.
  update:
    x-modelling-note: >-
      Orders carry both a numeric `state` enum and a coarser string `status`
      (basket / order). The two overlap; `state` is the authoritative lifecycle
      value.
