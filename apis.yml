aid: la-ruche-qui-dit-oui
name: La Ruche qui dit Oui!
description: >-
  La Ruche qui dit Oui! is a French direct-from-farmer food marketplace, founded in Paris in 2010 and
  known in English-speaking markets as The Food Assembly. It connects members with local and European
  producers through neighbourhood assemblies ("ruches" / hives) and, since a May 2025 merger with
  CrowdFarming, through direct home delivery of seasonal boxes, subscriptions and harvest "adoptions"
  in which a member reserves the output of a specific tree, hive or plot for a season. The company
  operated a public member-facing REST API documented as the Food Assembly API — OAuth 2 token
  issuance, assembly membership, distribution product and offer listings, and the basket/order payment
  flow — published as an API Blueprint in the lrqdo/developer repository. That developer documentation
  has not been updated since 2017, and there is no current developer portal, but the API host remains
  live behind bearer authentication.
