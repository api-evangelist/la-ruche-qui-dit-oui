summary: >-
  Cross-cutting standards assertions for The Food Assembly API. The provider
  publishes no compliance or certification programme, so every entry below is
  derived from observable behaviour rather than a provider claim. No
  certifications are asserted.
standards:
- id: oauth2
  name: OAuth 2.0 (RFC 6749)
  conforms: true
  evidence: >-
    Token endpoint implements the resource-owner password credentials grant and
    the refresh-token grant with client_id/client_secret, returning the standard
    access_token / token_type / expires_in / refresh_token response and the
    standard {"error": "invalid_grant"} error object.
  caveat: >-
    The password grant is discouraged by RFC 9700 (OAuth 2.0 Security Best
    Current Practice) and is omitted from OAuth 2.1. No PKCE, no authorization
    code flow, and no scopes are documented.
- id: rfc6750
  name: OAuth 2.0 Bearer Token Usage (RFC 6750)
  conforms: true
  evidence: >-
    Live host returns 401 with the `WWW-Authenticate: Bearer` challenge header.
- id: rfc9700
  name: OAuth 2.0 Security Best Current Practice
  conforms: false
  evidence: >-
    Relies on the resource-owner password credentials grant, which RFC 9700
    explicitly recommends against. No authorization code + PKCE flow is offered.
- id: oidc
  name: OpenID Connect
  conforms: false
  evidence: >-
    No id_token, no /.well-known/openid-configuration (404 on the API host), no
